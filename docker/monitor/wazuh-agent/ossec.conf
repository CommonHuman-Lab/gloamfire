<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <agent_name>gloamfire-attack-host</agent_name>
    </enrollment>
    <notify_time>10</notify_time>
    <time-reconnect>30</time-reconnect>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Monitor the attack event log written by the Gloamfire Python engine -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/gloamfire/attacks.log</location>
  </localfile>

  <!-- Disable noisy modules we don't need for Gloamfire detection -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="open-scap">
    <disabled>yes</disabled>
  </wodle>
</ossec_config>
