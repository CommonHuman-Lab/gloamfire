name: kill_chain
description: >
  Full adversary kill chain across all 20 scenarios in a realistic attack sequence:
  recon → initial access → C2 → privilege escalation → lateral movement →
  collection → exfiltration → persistence → defense evasion → impact.
on_fail: continue
scenarios:
  - recon
  - network_scan
  - suspicious_curl
  - suspicious_dns
  - reverse_shell
  - python_exec
  - encoded_command
  - c2_icmp
  - credential_dump
  - privilege_escalation
  - env_hijack
  - lateral_move
  - data_collection
  - exfil_http
  - persistence
  - account_backdoor
  - service_persistence
  - defense_evasion
  - log_tampering
  - fake_ransomware
