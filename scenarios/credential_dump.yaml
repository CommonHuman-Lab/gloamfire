name: credential_dump
description: >
  Safe simulation of OS credential dumping.
  Reads /etc/passwd and attempts /etc/shadow, writes a simulated dump file to /tmp.
  No real credentials are extracted or exfiltrated.
author: Gloamfire Team
version: "1.0"
tags:
  - credential-access
  - discovery

mitre:
  - T1003
  - T1552.001

steps:
  - id: credential_dump_attempt
    attack: credential_dump
    target: gloamfire-ubuntu

expect:
  - source: suricata
    description: "Suricata detects credential exfil DNS beacon (T1003)"
    required: true

  - source: wazuh
    rule_id: "100008"
    description: "Wazuh CRITICAL: OS credential dumping detected (T1003)"
    required: true

cleanup:
  - id: cleanup
    attack: credential_dump_cleanup
    target: gloamfire-ubuntu
